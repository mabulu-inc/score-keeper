<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Keeper</title>
<meta name="description" content="Card game score keeper that works offline. Starts with bid euchre.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scores">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1013;
    --panel: #171a20;
    --panel-2: #1e222a;
    --line: #2a2f3a;
    --text: #e8eaed;
    --muted: #8a9099;
    --accent: #ffb454;
    --accent-dim: #7a5626;
    --danger: #ff6b6b;
    --cool: #6ec1ff;
    --cool-dim: #2c5a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 4px 0 16px; display: flex; align-items: baseline; gap: 8px;
  }
  h1 em { color: var(--accent); font-style: normal; }
  h1 #sub { margin-left: auto; font-size: 11px; letter-spacing: .06em; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .tiny { font-size: 12px; }
  .center { text-align: center; }
  .gap { margin-top: 8px; }

  /* --- buttons --- */
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active:not(:disabled) { background: #262b35; }
  button:disabled { opacity: .3; cursor: default; }
  button.on { background: var(--accent); color: #1a1204; border-color: var(--accent); font-weight: 600; }
  button.primary { background: var(--accent); color: #1a1204; border-color: var(--accent); font-weight: 600; padding: 15px; }
  button.warn { border-color: var(--danger); color: var(--danger); }
  button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 8px 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- the table, seen from above --- */
  .table { display: grid; grid-template-columns: 1fr 1.05fr 1fr; gap: 8px; }
  .p-N { grid-column: 2; grid-row: 1; }
  .p-W { grid-column: 1; grid-row: 2; }
  .p-E { grid-column: 3; grid-row: 2; }
  .p-S { grid-column: 2; grid-row: 3; }
  .p-mid { grid-column: 2; grid-row: 2; display: flex; flex-direction: column;
           align-items: center; justify-content: center; color: var(--muted);
           font-size: 10px; line-height: 1.3; text-align: center; }
  .mid-lab { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .mid-val { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .seat {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 8px; min-height: 60px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .seat .nm { font-weight: 600; font-size: 15px; max-width: 100%;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat.t0 { border-color: var(--accent-dim); }
  .seat.t1 { border-color: var(--cool-dim); }
  .seat.t0 .nm { color: var(--accent); }
  .seat.t1 .nm { color: var(--cool); }
  .seat.empty { border-style: dashed; }
  .seat.sel { box-shadow: 0 0 0 2px var(--text) inset; }
  .seat.turn { background: #2c3340; box-shadow: 0 0 0 2px var(--text) inset; }
  .seat .tag { font-size: 10px; font-weight: 700; letter-spacing: .07em;
               text-transform: uppercase; color: var(--muted); }
  .seat .tag.live { color: var(--text); }
  .seat .x { position: absolute; top: 0; right: 0; width: 28px; height: 28px;
             color: var(--muted); font-size: 14px; background: none; border: none; padding: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.t0 { background: var(--accent); }
  .dot.t1 { background: var(--cool); }

  /* --- roster --- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 8px 12px; font-size: 14px; border-radius: 999px; }
  input[type=text] {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    width: 100%; -webkit-user-select: text; user-select: text;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  /* --- scoreboard --- */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .team { background: var(--panel); border: 1px solid var(--line); border-top-width: 3px;
          border-radius: 12px; padding: 12px; }
  .team.t0 { border-top-color: var(--accent); }
  .team.t1 { border-top-color: var(--cool); }
  .team .who { font-size: 12px; color: var(--muted); min-height: 2.5em; line-height: 1.25; }
  .team.lead .who { color: var(--text); }
  .team .pts { font: 700 40px/1 -apple-system, system-ui, sans-serif;
               font-variant-numeric: tabular-nums; margin: 6px 0 8px; }
  .team.t0 .pts { color: var(--accent); }
  .team.t1 .pts { color: var(--cool); }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .team.t0 .bar i { background: var(--accent); }
  .team.t1 .bar i { background: var(--cool); }

  .banner { text-align: center; font-size: 13px; color: var(--muted); margin: 14px 0 10px; }
  .banner b { color: var(--text); font-weight: 600; }

  .hi { text-align: center; margin-bottom: 14px; }
  .big { font: 700 28px/1.15 -apple-system, system-ui, sans-serif; }
  .big.sm { font-size: 21px; }
  .big.t0 { color: var(--accent); }
  .big.t1 { color: var(--cool); }

  /* --- trick entry: every button shows what it does to both scores --- */
  .tricks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tricks button { padding: 9px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tricks .n { font: 700 22px/1 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .tricks .d { font: 600 11px/1.3 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .tricks .d.t0 { color: var(--accent); }
  .tricks .d.t1 { color: var(--cool); }
  .tricks .d.bad { color: var(--danger); }

  .suit { font-size: 22px; line-height: 1.1; }
  .red { color: #ff7b7b; }

  /* --- hand log --- */
  table.log { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.log th { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
                 font-weight: 600; text-align: left; padding: 0 4px 6px; }
  table.log td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  table.log th.r, table.log td.r { text-align: right; }
  table.log .who { display: inline-block; max-width: 7ch; vertical-align: bottom;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.log .d0 { color: var(--accent); font-weight: 600; }
  table.log .d1 { color: var(--cool); font-weight: 600; }
  table.log .bad { color: var(--danger); }
  table.log .run { color: var(--muted); font-size: 11px; }

  /* --- previous games --- */
  .hist { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .hist:first-of-type { border-top: none; }
  .hist .txt { flex: 1; min-width: 0; }
  .hist .txt .win { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .txt .tiny { line-height: 1.35; }
  .hist button { padding: 8px 12px; font-size: 13px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .label { margin: 0; }
</style>
</head>
<body>
<h1>Score <em>Keeper</em><span id="sub" class="muted"></span></h1>
<div id="root"></div>

<script>
'use strict';

/* ==========================================================================
   RULES — bid euchre. Another game means another block shaped like this one.
   ========================================================================== */
const RULES = {
  game: 'Bid Euchre',
  tricks: 6,
  target: 40,
  bids: [
    { v: 3,  label: '3',              short: '3' },
    { v: 4,  label: '4',              short: '4' },
    { v: 5,  label: '5',              short: '5' },
    { v: 12, label: "Partner's best", short: 'PB',    all: true },
    { v: 24, label: 'Alone',          short: 'Alone', all: true }
  ],
  trumps: [
    { k: 'H',  label: '♥︎',    name: 'hearts',   red: true },
    { k: 'D',  label: '♦︎',    name: 'diamonds', red: true },
    { k: 'C',  label: '♣︎',    name: 'clubs'  },
    { k: 'S',  label: '♠︎',    name: 'spades' },
    { k: 'HI', label: 'High', name: 'high, no trump', min: 4 },
    { k: 'LO', label: 'Low',  name: 'low, no trump',  min: 4 }
  ],

  /* Tricks taken by the bidding team is the only number a hand needs.
     Made a numeric bid: score every trick taken, overtricks included.
     Set: lose the bid outright.  Partner's best and alone need all six.
     The defenders bank a point per trick whatever happens. */
  score(bid, tricks) {
    const b = bidOf(bid);
    const made = b.all ? tricks === RULES.tricks : tricks >= bid;
    return {
      made,
      bidders:   made ? (b.all ? bid : tricks) : -bid,
      defenders: RULES.tricks - tricks
    };
  }
};

const bidOf   = v => RULES.bids.find(b => b.v === v);
const trumpOf = k => RULES.trumps.find(t => t.k === k);

/* ==========================================================================
   STORAGE
   ========================================================================== */
const LS = 'score-keeper-v1';
const blank = () => ({ roster: [], history: [], game: null, undo: [], setup: null });

let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(LS)) || {}); }
catch (e) { S = blank(); }

const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };

// Screen-local flags, deliberately not persisted.
let editRoster = false;
let confirmEnd = false;

const nameOf = id => (S.roster.find(p => p.id === id) || {}).name || '?';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = n => (n < 0 ? '\u2212' : '') + Math.abs(n);          // U+2212, not a hyphen
const delta = n => (n > 0 ? '+' : '') + fmt(n);

/* ==========================================================================
   GAME STATE
   ========================================================================== */
const POS = ['S', 'W', 'N', 'E'];        // seat 0..3, clockwise from the near side
const teamOf = seat => seat % 2;         // partners sit opposite: 0+2 against 1+3

const teamName  = (g, t) => nameOf(g.seats[t]) + ' & ' + nameOf(g.seats[t + 2]);
const dealerFor = (g, hand) => (g.firstDealer + hand) % 4;
const bidLabel  = v => bidOf(v).short;

function totals(g) {
  const s = [0, 0];
  for (const h of g.hands) { s[0] += h.d0; s[1] += h.d1; }
  return s;
}

/* Undo is a stack of whole-game snapshots — nothing to keep in sync, and it
   reaches back through bidding, trump and finished hands alike. */
function push() {
  if (!S.game) return;
  S.undo.push(JSON.stringify(S.game));
  if (S.undo.length > 40) S.undo.shift();
}

function startBidding(g) {
  const dealer = dealerFor(g, g.hands.length);
  g.phase = 'bid';
  g.bidding = { dealer, turn: (dealer + 1) % 4, actions: [] };
  g.pending = null;
}

// Each bid must beat the last, so the most recent bid is the high one.
function highBid(b) {
  for (let i = b.actions.length - 1; i >= 0; i--) if (b.actions[i].v) return b.actions[i];
  return null;
}

function minBid(b) {
  const h = highBid(b);
  if (!h) return RULES.bids[0].v;
  const next = RULES.bids[RULES.bids.findIndex(x => x.v === h.v) + 1];
  return next ? next.v : Infinity;
}

// The dealer cannot pass into a dead bid — screw the dealer.
const stuck = b => b.turn === b.dealer && !highBid(b);

function takeTurn(g, v) {
  const b = g.bidding;
  b.actions.push({ seat: b.turn, v });
  b.turn = (b.turn + 1) % 4;
  if (b.actions.length < 4) return;
  const h = highBid(b);
  g.pending = { bidder: h.seat, bid: h.v, trump: null };
  g.bidding = null;
  g.phase = 'trump';
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */
const ACT = {

  /* ---- setting the table ---- */
  newGame() {
    S.setup = { seats: [null, null, null, null], first: null, sel: null };
    done();
  },

  addPlayer() {
    const el = document.getElementById('newname');
    const name = el.value.trim();
    if (!name) return;
    let p = S.roster.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (!p) { p = { id: uid('p'), name }; S.roster.unshift(p); }
    el.value = '';
    seatPlayer(p.id);
    done(true);
  },

  toggleRoster(d) {
    const i = S.setup.seats.indexOf(d.id);
    if (i >= 0) S.setup.seats[i] = null; else seatPlayer(d.id);
    S.setup.sel = null;
    done();
  },

  // Tap one seat then another to swap them; that is the whole re-ordering UI.
  tapSeat(d) {
    const i = +d.i, st = S.setup;
    if (!st.seats[i]) { st.sel = null; done(); return; }
    if (st.sel === null || st.sel === i) {
      st.sel = st.sel === i ? null : i;
    } else {
      [st.seats[st.sel], st.seats[i]] = [st.seats[i], st.seats[st.sel]];
      st.sel = null;
    }
    done();
  },

  unseat(d) { S.setup.seats[+d.i] = null; S.setup.sel = null; done(); },
  first(d)  { S.setup.first = +d.i; done(); },
  editRoster() { editRoster = !editRoster; done(); },
  delPlayer(d) { S.roster = S.roster.filter(p => p.id !== d.id); done(); },
  cancelSetup() { S.setup = null; editRoster = false; done(); },

  start() {
    const st = S.setup;
    if (st.seats.some(s => !s) || st.first === null) return;
    // Players float to the front of the roster as they are used.
    for (const id of [...st.seats].reverse()) {
      const i = S.roster.findIndex(p => p.id === id);
      if (i > 0) S.roster.unshift(S.roster.splice(i, 1)[0]);
    }
    S.game = {
      id: uid('g'),
      started: new Date().toISOString(),
      seats: st.seats.slice(),
      firstDealer: st.first,
      hands: [], phase: null, bidding: null, pending: null,
      done: false, winner: null
    };
    S.undo = [];
    S.setup = null;
    editRoster = false;
    startBidding(S.game);
    done();
  },

  /* ---- playing a hand ---- */
  bid(d)  { push(); takeTurn(S.game, +d.v); done(); },
  pass()  { push(); takeTurn(S.game, null); done(); },

  trump(d) {
    push();
    S.game.pending.trump = d.k;
    S.game.phase = 'tricks';
    done();
  },

  tricks(d) {
    push();
    const g = S.game, p = g.pending, t = +d.t;
    const r = RULES.score(p.bid, t);
    const bt = teamOf(p.bidder);

    g.hands.push({
      dealer: dealerFor(g, g.hands.length),
      bidder: p.bidder, bid: p.bid, trump: p.trump, tricks: t, made: r.made,
      d0: bt === 0 ? r.bidders : r.defenders,
      d1: bt === 1 ? r.bidders : r.defenders
    });

    const s = totals(g);
    if (s[0] >= RULES.target || s[1] >= RULES.target) {
      g.done = true;
      // Both teams can cross the line on one hand; the team that made its bid takes it.
      g.winner = (s[0] >= RULES.target && s[1] >= RULES.target) ? bt
               : (s[0] >= RULES.target ? 0 : 1);
      g.phase = 'over';
      g.finished = new Date().toISOString();
      S.history.unshift(JSON.parse(JSON.stringify(g)));
      S.history = S.history.slice(0, 40);
      scrollTo(0, 0);
    } else {
      startBidding(g);
    }
    done();
  },

  undo() {
    const prev = S.undo.pop();
    if (!prev) return;
    const wasDone = S.game.done;
    S.game = JSON.parse(prev);
    if (wasDone) S.history = S.history.filter(h => h.id !== S.game.id);
    done();
  },

  /* ---- getting around ---- */
  home()      { S.game = null; S.undo = []; confirmEnd = false; done(); },
  askEnd()    { confirmEnd = true; done(); },
  keepGoing() { confirmEnd = false; done(); },

  again(d) {
    const g = d.id ? S.history.find(h => h.id === d.id) : S.game;
    if (!g) return;
    // Same seats, and the deal moves on one place from where it finished.
    const last = dealerFor(g, Math.max(0, g.hands.length - 1));
    S.setup = { seats: g.seats.slice(), first: (last + 1) % 4, sel: null };
    S.game = null; S.undo = []; confirmEnd = false;
    done();
  },

  delHist(d) { S.history = S.history.filter(h => h.id !== d.id); done(); }
};

function seatPlayer(id) {
  const seats = S.setup.seats;
  if (seats.includes(id)) return;
  const i = seats.indexOf(null);
  if (i >= 0) seats[i] = id;
}

function done(keepFocus) { save(); render(keepFocus); }

/* ==========================================================================
   RENDER
   ========================================================================== */
const root = document.getElementById('root');
const sub  = document.getElementById('sub');

function tableHTML(seats, opt) {
  opt = opt || {};
  let h = '<div class="card"><div class="table">';
  for (let i = 0; i < 4; i++) {
    const id = seats[i];
    const cls = ['seat', 'p-' + POS[i], id ? 't' + teamOf(i) : 'empty'];
    if (opt.sel === i) cls.push('sel');
    if (opt.turn === i) cls.push('turn');
    const tags = (opt.tag ? opt.tag(i) : []).filter(Boolean);

    h += '<div class="' + cls.join(' ') + '"' +
         (opt.act ? ' data-act="' + opt.act + '" data-i="' + i + '"' : '') + '>' +
         (id ? '<div class="nm">' + esc(nameOf(id)) + '</div>'
             : '<div class="nm muted">Seat ' + (i + 1) + '</div>') +
         tags.map(t => '<div class="tag' + (t.live ? ' live' : '') + '">' + t.text + '</div>').join('') +
         (id && opt.remove ? '<button class="x" data-act="unseat" data-i="' + i + '">✕</button>' : '') +
         '</div>';
  }
  return h + '<div class="p-mid">' + (opt.mid || '↻') + '</div></div></div>';
}

const tag = (text, live) => ({ text, live: !!live });

// The middle of the table holds the contract: what has been bid, and in what.
function midHTML(g) {
  if (g.bidding) {
    const h = highBid(g.bidding);
    return '<div class="mid-lab">bid</div><div class="mid-val">' +
           (h ? bidLabel(h.v) : '\u2014') + '</div>';
  }
  const p = g.pending, t = trumpOf(p.trump);
  return '<div class="mid-lab">bid</div><div class="mid-val">' + bidLabel(p.bid) +
         (t ? ' <span class="' + (t.red ? 'red' : '') + '">' + t.label + '</span>' : '') + '</div>';
}

function render(keepFocus) {
  if (S.setup)     { sub.textContent = 'NEW GAME';            root.innerHTML = viewSetup(); }
  else if (S.game) { sub.textContent = RULES.game.toUpperCase(); root.innerHTML = viewGame(); }
  else             { sub.textContent = '';                    root.innerHTML = viewHome(); }
  if (keepFocus) {
    const el = document.getElementById('newname');
    if (el) el.focus();
  }
}

/* ---- home ---- */
function viewHome() {
  let h = '<button class="primary" style="width:100%" data-act="newGame">New game</button>';

  if (S.history.length) {
    h += '<div class="card gap"><div class="label">Previous games</div>';
    for (const g of S.history.slice(0, 12)) {
      const s = totals(g), w = g.winner;
      h += '<div class="hist"><div class="txt">' +
             '<div class="win"><span class="dot t' + w + '"></span> <b>' + esc(teamName(g, w)) +
                '</b> <span class="muted">' + fmt(s[w]) + ' to ' + fmt(s[1 - w]) + '</span></div>' +
             '<div class="tiny muted">v ' + esc(teamName(g, 1 - w)) +
                ' · ' + fmtDate(g.finished || g.started) + '</div>' +
           '</div>' +
           '<button data-act="again" data-id="' + g.id + '">Play again</button>' +
           '<button class="ghost" data-act="delHist" data-id="' + g.id + '">✕</button></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="card gap center muted tiny" style="padding:26px 16px;line-height:1.7">' +
         'Bid euchre — four players, two teams, first to ' + RULES.target + '.<br>' +
         'Tap <b>New game</b> to set the table.</div>';
  }
  return h;
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined,
    sameYear ? { month: 'short', day: 'numeric' }
             : { year: 'numeric', month: 'short', day: 'numeric' });
}

/* ---- setting the table ---- */
function viewSetup() {
  const st = S.setup;
  const full = st.seats.every(s => s);

  let h = tableHTML(st.seats, {
    act: 'tapSeat', sel: st.sel, remove: true,
    mid: full ? 'tap two<br>to swap' : 'partners<br>sit opposite',
    tag: i => [st.first === i ? tag('deals 1st', true) : null]
  });

  h += '<div class="card">' +
       '<div class="label" style="display:flex">Players' +
         (S.roster.length ? '<span style="margin-left:auto"><button class="ghost" data-act="editRoster" ' +
            'style="font:inherit;letter-spacing:.1em;padding:0">' +
            (editRoster ? 'DONE' : 'EDIT') + '</button></span>' : '') +
       '</div>' +
       '<div class="row" style="margin-bottom:10px">' +
         '<input type="text" id="newname" placeholder="Add a player" autocomplete="off" ' +
                'autocapitalize="words" enterkeyhint="done" style="flex:3">' +
         '<button data-act="addPlayer" style="flex:1">Add</button>' +
       '</div>';

  if (S.roster.length) {
    h += '<div class="chips">';
    for (const p of S.roster.slice(0, 30)) {
      const seated = st.seats.includes(p.id);
      h += editRoster
        ? '<button class="warn" data-act="delPlayer" data-id="' + p.id + '">' + esc(p.name) + ' ✕</button>'
        : '<button class="' + (seated ? 'on' : '') + '" data-act="toggleRoster" data-id="' + p.id + '">' +
          esc(p.name) + '</button>';
    }
    h += '</div>';
    if (editRoster) h += '<div class="tiny muted gap">Tap a name to forget it. Finished games keep their own record.</div>';
  }
  h += '</div>';

  if (full) {
    h += '<div class="card"><div class="label">Who deals first?</div><div class="grid4">';
    for (let i = 0; i < 4; i++) {
      h += '<button class="clip ' + (st.first === i ? 'on' : '') + '" data-act="first" data-i="' + i +
           '" style="font-size:13px;padding:11px 4px">' + esc(nameOf(st.seats[i])) + '</button>';
    }
    h += '</div><div class="tiny muted gap">Then the deal moves clockwise: ' +
         st.seats.map(s => esc(nameOf(s))).join(' → ') + '</div></div>';
  }

  h += '<div class="row">' +
       '<button data-act="cancelSetup" style="flex:1">Cancel</button>' +
       '<button class="primary" style="flex:2" data-act="start"' +
         (full && st.first !== null ? '' : ' disabled') + '>Start game</button></div>';
  return h;
}

/* ---- a game in progress ---- */
function viewGame() {
  const g = S.game;
  const s = totals(g);
  const lead = s[0] === s[1] ? -1 : (s[0] > s[1] ? 0 : 1);

  let h = '<div class="board">';
  for (let t = 0; t < 2; t++) {
    h += '<div class="team t' + t + (lead === t ? ' lead' : '') + '">' +
           '<div class="who">' + esc(teamName(g, t)) + '</div>' +
           '<div class="pts">' + fmt(s[t]) + '</div>' +
           '<div class="bar"><i style="width:' +
             Math.max(0, Math.min(100, s[t] / RULES.target * 100)) + '%"></i></div></div>';
  }
  h += '</div>';

  h += g.done ? viewOver(g, s) : viewHand(g);
  h += viewLog(g);

  if (g.done) {
    h += '<div class="row"><button data-act="undo"' + (S.undo.length ? '' : ' disabled') +
         '>Undo</button><button data-act="home">Home</button></div>';
  } else if (confirmEnd) {
    h += '<div class="card center"><div class="tiny muted" style="margin-bottom:10px">' +
         'Discard this game? It will not be saved.</div><div class="row">' +
         '<button data-act="keepGoing">Keep playing</button>' +
         '<button class="warn" data-act="home">Discard</button></div></div>';
  } else {
    h += '<div class="row"><button data-act="undo"' + (S.undo.length ? '' : ' disabled') +
         '>Undo</button><button data-act="askEnd">End game</button></div>';
  }
  return h;
}

function viewHand(g) {
  const n = g.hands.length;
  const dealer = dealerFor(g, n);
  const turn = g.bidding ? g.bidding.turn : (g.pending ? g.pending.bidder : null);

  let h = '<div class="banner">Hand <b>' + (n + 1) + '</b> &nbsp;·&nbsp; <b>' +
          esc(nameOf(g.seats[dealer])) + '</b> deals</div>';

  h += tableHTML(g.seats, {
    turn,
    mid: midHTML(g),
    tag: i => {
      const out = [i === dealer ? tag('deal') : null];
      if (g.bidding) {
        const a = g.bidding.actions.find(a => a.seat === i);
        const high = highBid(g.bidding);
        if (a && a.v) out.push(high.seat === i ? tag('bid ' + bidLabel(a.v), true)
                                               : tag('was ' + bidLabel(a.v)));
        else if (a)   out.push(tag('pass'));
        else if (i === g.bidding.turn) out.push(tag('to bid', true));
      } else if (g.pending && i === g.pending.bidder) {
        out.push(tag(bidLabel(g.pending.bid) +
          (g.pending.trump ? ' ' + trumpOf(g.pending.trump).label : ''), true));
      }
      return out;
    }
  });

  return h + { bid: panelBid, trump: panelTrump, tricks: panelTricks }[g.phase](g);
}

function panelBid(g) {
  const b = g.bidding;
  const min = minBid(b), high = highBid(b), noPass = stuck(b);

  let h = '<div class="card"><div class="label">Bidding</div>' +
          '<div class="hi"><div class="big t' + teamOf(b.turn) + '">' +
            esc(nameOf(g.seats[b.turn])) + '</div><div class="tiny muted">' +
            (high ? esc(nameOf(g.seats[high.seat])) + ' holds ' + bidOf(high.v).label.toLowerCase() +
                    ' — bid higher or pass'
                  : noPass ? 'Screw the dealer — a bid must be made'
                           : 'no bid yet') +
          '</div></div>';

  h += '<button style="width:100%;margin-bottom:8px" data-act="pass"' +
       (noPass ? ' disabled' : '') + '>Pass</button><div class="grid3">';
  for (const x of RULES.bids.slice(0, 3)) {
    h += '<button data-act="bid" data-v="' + x.v + '"' + (x.v >= min ? '' : ' disabled') +
         '>' + x.label + '</button>';
  }
  h += '</div><div class="grid2 gap">';
  for (const x of RULES.bids.slice(3)) {
    h += '<button class="clip" data-act="bid" data-v="' + x.v + '"' + (x.v >= min ? '' : ' disabled') +
         '>' + x.label + ' <span class="muted tiny">' + x.v + '</span></button>';
  }
  return h + '</div><div class="tiny muted gap center">Partner’s best and alone take all ' +
             RULES.tricks + ' tricks or lose their value.</div></div>';
}

function panelTrump(g) {
  const p = g.pending;
  let h = '<div class="card"><div class="label">Call trump</div>' +
          '<div class="hi"><div class="big t' + teamOf(p.bidder) + '">' +
            esc(nameOf(g.seats[p.bidder])) + '</div><div class="tiny muted">won the bid at ' +
            bidOf(p.bid).label.toLowerCase() + '</div></div><div class="grid4">';

  for (const t of RULES.trumps.slice(0, 4)) {
    h += '<button data-act="trump" data-k="' + t.k + '"><span class="suit' +
         (t.red ? ' red' : '') + '">' + t.label + '</span></button>';
  }
  h += '</div><div class="grid2 gap">';
  for (const t of RULES.trumps.slice(4)) {
    h += '<button data-act="trump" data-k="' + t.k + '"' +
         (p.bid >= (t.min || 0) ? '' : ' disabled') + '>' + t.label + '</button>';
  }
  h += '</div>';
  if (p.bid < 4) h += '<div class="tiny muted gap center">High and low need a bid of 4 or more.</div>';
  return h + '</div>';
}

function panelTricks(g) {
  const p = g.pending, bt = teamOf(p.bidder), t = trumpOf(p.trump);

  let h = '<div class="card"><div class="label">Tricks won</div>' +
          '<div class="hi"><div class="big sm t' + bt + '">' + esc(teamName(g, bt)) + '</div>' +
          '<div class="tiny muted">bid ' + bidOf(p.bid).label.toLowerCase() + ' in ' +
            '<span class="' + (t.red ? 'red' : '') + '">' + t.name + '</span>' +
          ' — how many did they take?</div></div><div class="tricks">';

  for (let n = 0; n <= RULES.tricks; n++) {
    const r = RULES.score(p.bid, n);
    h += '<button data-act="tricks" data-t="' + n + '">' +
           '<span class="n">' + n + '</span>' +
           '<span class="d t' + bt + (r.made ? '' : ' bad') + '">' +
             delta(r.bidders) + '</span>' +
           '<span class="d t' + (1 - bt) + '">' + delta(r.defenders) + '</span></button>';
  }
  return h + '</div><div class="tiny muted gap center">Each button shows the points it scores: ' +
             esc(teamName(g, bt)) + ' above, ' + esc(teamName(g, 1 - bt)) + ' below.</div></div>';
}

function viewOver(g, s) {
  const w = g.winner;
  return '<div class="card center"><div class="label">Game over</div>' +
         '<div class="big sm t' + w + '">' + esc(teamName(g, w)) + ' win</div>' +
         '<div class="muted tiny gap">' + fmt(s[w]) + ' to ' + fmt(s[1 - w]) + ' in ' + g.hands.length +
         ' hands</div><button class="primary gap" style="width:100%;margin-top:14px" ' +
         'data-act="again">Play again</button></div>';
}

function viewLog(g) {
  if (!g.hands.length) return '';
  const run = [0, 0];
  let rows = '';

  g.hands.forEach((h, i) => {
    run[0] += h.d0; run[1] += h.d1;
    const t = trumpOf(h.trump), bt = teamOf(h.bidder);
    rows += '<tr><td class="muted">' + (i + 1) + '</td>' +
      '<td class="muted"><span class="who">' + esc(nameOf(g.seats[h.dealer])) + '</span></td>' +
      '<td><span class="who d' + bt + '">' + esc(nameOf(g.seats[h.bidder])) + '</span> ' +
        bidLabel(h.bid) + ' <span class="' + (t.red ? 'red' : 'muted') + '">' + t.label + '</span></td>' +
      '<td class="r">' + h.tricks + '</td>' + cell(h.d0, 0, run[0]) + cell(h.d1, 1, run[1]) + '</tr>';
  });

  return '<div class="card"><details open><summary><div class="label">Hands</div></summary>' +
         '<table class="log"><thead><tr><th>#</th><th>Deal</th><th>Bid</th><th class="r">Tk</th>' +
         '<th class="r"><span class="dot t0"></span></th>' +
         '<th class="r"><span class="dot t1"></span></th></tr></thead>' +
         '<tbody>' + rows + '</tbody></table></details></div>';
}

const cell = (d, t, run) =>
  '<td class="r"><span class="d' + t + (d < 0 ? ' bad' : '') + '">' + delta(d) +
  '</span><br><span class="run">' + fmt(run) + '</span></td>';

/* ==========================================================================
   EVENTS
   ========================================================================== */
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.stopPropagation(); fn(el.dataset); }
});

root.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newname') { e.preventDefault(); ACT.addPlayer(); }
});

render();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
