/* ==========================================================================
   FARKLE — one player at a time, and everything the app does happens inside
   a turn. The dice themselves are on the table, not on the screen: what it
   is told is which of them were taken out for scoring, roll by roll, and
   from that it knows what the turn is worth and what rolling on would cost.
   ========================================================================== */

/* Where a turn stands, worked out once and read by everything: what is out
   on the felt, what it is worth, and how many dice are still live — six
   again the moment all six have been taken out, which is what hot dice are.
   `ok` is the rule that every die taken out has to score. */
function turnFk(g) {
  const t = g.turn;
  const set = FARKLE.score(t.keep);
  const kept = t.rolls.reduce((a, r) => a + r.length, 0);
  const hot = kept > 0 && kept % FARKLE.dice === 0;
  const banked = t.rolls.reduce((a, r) => a + FARKLE.score(r).pts, 0);

  return { t, set, kept, hot, banked,
           pts:  banked + set.pts,
           left: (hot ? FARKLE.dice : FARKLE.dice - kept % FARKLE.dice) - t.keep.length,
           ok:   t.keep.length > 0 && set.dead.length === 0 };
}

/* A turn is a hand of one. It is recorded against the player who took it, in
   the same shape a hand of Flip 7 uses, so the totals, the board, the log and
   people coming and going all read it without being told about dice. */
function endTurn(g, pts) {
  const id = g.players[g.hands.length % g.players.length];
  // Named after the turn rather than the player: the log below says whose it
  // was, and a long name turns the button into three lines of wrapped text.
  push('the last turn');
  g.hands.push({ who: id, pts: { [id]: pts }, farkle: !pts });
  g.turn = { rolls: [], keep: [] };
  showRisk = false;
  finish(g);
  done();
}

function viewTurnFk(g, s) {
  const u = turnFk(g), t = u.t;
  const at = g.hands.length % g.players.length;
  const id = g.players[at];
  const round = Math.floor(g.hands.length / g.players.length) + 1;
  const best = Math.max(...s);

  let h = '<div class="banner">' + FARKLE.game + ' &nbsp;·&nbsp; Round <b>' + round +
          '</b> &nbsp;·&nbsp; <b>' + esc(nameOf(id)) + '</b> to roll' +
          // Say why the game did not just end, rather than leaving the table guessing.
          (best < FARKLE.target ? ''
            : s.filter(x => x === best).length > 1
              ? '<br>Level on <b>' + fmt(best) + '</b> — play on until someone leads'
              : '<br><b>' + esc(nameOf(g.players[s.indexOf(best)])) + '</b> is past ' +
                fmt(FARKLE.target) + ' — one turn each left to beat it') +
          '</div>';

  h += '<div class="card"><div class="label">' + esc(nameOf(id)) + '\u2019s turn</div>';

  // What earlier rolls in this turn already put by, so the number below can be
  // read back against the dice actually sitting on the table.
  if (t.rolls.length) {
    h += '<div class="tiny muted" style="margin-bottom:12px;line-height:2.1">' +
         t.rolls.map(r => r.map(d => die(d, 'sm')).join(' ') + ' <b>' +
           fmt(FARKLE.score(r).pts) + '</b>').join(' &nbsp;&nbsp; ') + '</div>';
  }

  h += '<div class="tiny muted" style="margin-bottom:8px">' +
       // Nothing left on the table means all six again, whichever pass this is.
       (u.left > 0
         ? '<b>' + COUNT[u.left] + ' ' + (u.left === 1 ? 'die' : 'dice') + '</b> still on the ' +
           'table — tap each one taken out for scoring.'
         : 'All six taken out — <b>hot dice</b>. Roll all six again keeping this, or bank it.') +
       '</div>';

  h += '<div class="dice">';
  for (let f = 1; f <= 6; f++) {
    h += '<button data-act="keepDie" data-f="' + f + '"' + (u.left > 0 ? '' : ' disabled') +
         '>' + die(f) + '</button>';
  }
  h += '</div>';

  // The dice taken out of the roll in front of you. Tapping one puts it back,
  // so a mis-tap costs a tap; a die that scores nothing is marked as such
  // rather than quietly counted as nought.
  h += '<div class="kept">' + (t.keep.length
        ? t.keep.map((d, i) =>
            '<button class="' + (u.set.dead.includes(d) ? 'dead' : 'on') + '" ' +
            'data-act="dropDie" data-i="' + i + '">' + die(d) + '</button>').join('')
        : '<span class="none">Nothing taken out of this roll yet</span>') + '</div>';

  h += '<div class="tot"><div class="n' + (u.pts ? '' : ' zero') + '">' + fmt(u.pts) + '</div>' +
       '<div class="ex">' + fkExplain(u) + '</div></div>';

  h += '<button class="sect" data-act="risk"><span>If you roll again</span>' +
         '<span class="cue">' + (showRisk ? 'hide' : 'show') + '</span></button>' +
       (showRisk ? riskFk(g, id, u, s[at]) : '') +
       '</div>';

  /* One decision at a time. Nothing has been taken out of the roll, so the
     only thing that can have happened is a farkle; something has, so the only
     things left are to roll on or to stop.

     Undo keeps the other company, and says what it takes back — which is
     where it is wanted, since the turn it undoes is the one that ended just
     above this button. With dice in hand there is nothing for it to do that
     tapping one of them back does not, and three buttons that say what they
     mean do not fit across a phone. */
  return h + '<div class="act row">' +
    (t.keep.length
      ? '<button data-act="rollOn"' + (u.ok ? '' : ' disabled') + '>Roll again</button>' +
        '<button class="primary" style="flex:2" data-act="bank"' + (u.ok ? '' : ' disabled') +
          '>Bank ' + fmt(u.pts) + '</button>'
      : (S.undo.length ? undoButton() : '') +
        '<button style="flex:2" data-act="farkled">Farkled' +
        (u.pts ? ' &nbsp;' + fmt(-u.pts) : '') + '</button>') +
    '</div>';
}

// Show the sum being done, not just its answer — and name the dice that are
// doing nothing, because keeping one is the mistake the rules do not allow.
function fkExplain(u) {
  if (u.set.dead.length) {
    const d = u.set.dead.filter((f, i) => u.set.dead.indexOf(f) === i);
    return '<span class="bad">The ' + d.slice(0, -1).join(', ') +
           (d.length > 1 ? ' and ' : '') + d[d.length - 1] +
           (d.length > 1 ? ' score' : ' scores') + ' nothing — every die you take out ' +
           'has to count. Tap it to put it back.</span>';
  }
  const parts = u.set.parts.slice();
  if (!parts.length) return u.banked ? 'Set by so far — now tap what came out of this roll'
                                     : 'Tap each die taken out for scoring';
  return (u.banked ? fmt(u.banked) + ' set by, then ' : '') + parts.join(' + ');
}

/* The only question at a Farkle table, and the reason the game is played at
   all: what is on the table, and how likely the next roll is to take it. */
function riskFk(g, id, u, was) {
  const next = u.left > 0 ? u.left : FARKLE.dice;      // all six out means all six again
  const odds = FARKLE.odds[next];
  const now = was + u.pts;
  const short = FARKLE.target - now;

  return '<div class="risk tiny muted">' +
    '<div>' + (u.pts
      ? 'Roll again and <b>' + fmt(u.pts) + '</b> goes back on the table. A farkle takes all of it.'
      : 'Nothing on the table yet — the first roll of a turn costs nothing.') + '</div>' +
    '<div>Rolling <b>' + next + '</b> ' + (next === 1 ? 'die' : 'dice') + ': about <b>' +
      Math.round(odds * 100) + '%</b> of rolls come up with nothing at all' +
      // One in three or worse reads better as a share than as odds.
      (odds < .4 ? ', or one roll in ' + Math.round(1 / odds) : '') + '.</div>' +
    '<div>Bank instead and ' + esc(nameOf(id)) + ' is on <b>' + fmt(now) + '</b>' +
      (short > 0 ? ', ' + fmt(short) + ' short of ' + fmt(FARKLE.target)
                 : ' — past ' + fmt(FARKLE.target)) + '.</div>' +
    '</div>';
}

/* One row a round, everyone's turn side by side. Turns are taken in order, so
   a round is over the moment it comes back to somebody who has already been —
   which stays true when people join or leave part way through. */
function logFarkle(g) {
  const all = everyone(g);
  const run = {}, rows = [];
  let row = null;

  for (const h of g.hands) {
    if (!row || (h.who in row)) rows.push(row = {});
    run[h.who] = (run[h.who] || 0) + (h.pts[h.who] || 0);
    row[h.who] = { pts: h.pts[h.who] || 0, farkle: h.farkle, run: run[h.who] };
  }

  const body = rows.map((r, i) =>
    '<tr><td class="muted">' + (i + 1) + '</td>' +
    all.map(id => {
      const c = r[id];
      // A round played before somebody joined, or after they left, is blank
      // for them rather than nought — they were not there to score nothing.
      if (!c) return '<td class="r muted">·</td>';
      return '<td class="r"><span class="' + (c.farkle ? 'bad' : '') + '">' +
             (c.farkle ? 'farkle' : fmt(c.pts)) + '</span><br>' +
             '<span class="run">' + fmt(c.run) + '</span></td>';
    }).join('') + '</tr>').join('');

  return '<div style="overflow-x:auto"><table class="log"><thead><tr><th>#</th>' +
         all.map(id => '<th class="r"><span class="who">' + esc(nameOf(id)) + '</span></th>').join('') +
         '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

/* ==========================================================================
   THE MENU — the three things you might want from any screen. Each opens
   where it stands rather than taking you somewhere else and back.
   ========================================================================== */
/* The waiting update is worth a button: the new page is already cached, so
   reloading is all that stands between it and being the one you are using. */
function buildLine() {
  const stale = cached && cached !== BUILD;
  return '<div class="tiny muted center">Score Keeper ' + BUILD +
           (stale ? ' · <b>' + cached + ' ready</b>' : '') + '</div>' +
         (stale ? '<button class="primary" style="width:100%;margin-top:10px" ' +
                  'data-act="reload">Reload to finish updating</button>' : '');
}

function menuPanel() {
  const g = S.game;
  const games = Object.keys(KINDS).length;

  let h = '<div class="scrim" data-act="closeMenu"></div>' +
          '<div class="popwrap"><div class="pop">' +
            row('players', 'Players',    active().length + ' remembered') +
            row('rules',   'Rules',      games === 2 ? 'both games' : games + ' games') +
            row('games',   'Past games', S.history.length ? S.history.length + ' finished'
                                                          : 'none yet');

  /* Both ways out of a game, together, with the one you almost always want
     first. End game used to sit in the footer where the common action goes,
     which put the only destructive control in the app under the thumb of
     somebody reaching for Undo. */
  if (g && !away) {
    h += '<div class="foot">' +
           '<button style="width:100%" data-act="stepOut">Leave this game for now</button>' +
           '<button class="warn" style="width:100%;margin-top:8px" data-act="askEnd">' +
             'End game</button>' +
         '</div>';
  }
  return h + '<div class="foot">' + buildLine() + '</div></div></div>';
}

// A row is a way out of the menu, not something that unfolds inside it.
const row = (id, title, hint) =>
  '<button class="sect" data-act="menuTab" data-t="' + id + '">' +
    '<span>' + title + '</span><span class="cue">' + esc(hint) + '</span></button>';

/* What you picked, as an ordinary screen. The panel is already gone, so there
   is one way out of here and Back is it — Done says the same thing for anyone
   who would rather tap than swipe. */
function viewSection() {
  const sec = { players: ['Players',    playersBody],
                rules:   ['Rules',      rulesBody],
                games:   ['Past games', boardBody] }[menuTab];
  if (!sec) return viewHome();

  return '<div class="card"><div class="label" style="display:flex">' + sec[0] +
           '<span style="margin-left:auto"><button class="ghost" data-act="closeTab" ' +
           'style="font:inherit;letter-spacing:.1em;padding:0">DONE</button></span></div>' +
           sec[1]() +
         '</div>';
}

function playersBody() {
  if (!active().length) {
    return '<div class="tiny muted">Nobody yet. Players are remembered as you add them ' +
           'to a game.</div>';
  }
  return nameEditor(active().map(p => p.id)) +
         '<div class="tiny muted">Correct a spelling and it is right everywhere at once, ' +
         'including games already finished. ✕ forgets a player without touching the games ' +
         'they played in' +
         (S.game ? ', and cannot take anyone out of the game being played' : '') + '.</div>';
}

/* One game at a time, always. Stacking every game on one page turns a
   reminder you were meant to skim into something you have to search. The
   screen usually knows which game you mean; the chips are for when it does
   not, and for looking the other one up. */
const rulesFocus = () =>
  rulesKind || (S.game ? kindOf(S.game) : S.setup ? S.setup.kind : Object.keys(KINDS)[0]);

function rulesBody() {
  const k = rulesFocus(), R = KINDS[k];

  return '<div class="chips" style="margin-bottom:14px">' +
    Object.keys(KINDS).map(x =>
      '<button class="' + (x === k ? 'on' : '') + '" data-act="rulesKind" data-k="' + x + '">' +
      KINDS[x].game + '</button>').join('') +
    '</div>' +
    ruleRows(R.rules) +
    '<div class="label" style="margin:22px 0 8px">Worth knowing</div>' +
    ruleRows(R.strategy);
}

/* ==========================================================================
   THE BOARD — every finished game already carried its full record. This is
   where it finally gets read.
   ========================================================================== */

// Euchre is won by a partnership, so a win counts for both partners.
const wonBy = g => solo(g) ? [g.players[g.winner]]
                           : [g.seats[g.winner], g.seats[g.winner + 2]];
const playedBy = g => solo(g) ? g.players : g.seats;

function record() {
  const rec = {};
  for (const g of S.history) {
    const won = wonBy(g);
    for (const id of playedBy(g)) {
      const r = rec[id] = rec[id] || { id, played: 0, won: 0 };
      r.played++;
      if (won.includes(id)) r.won++;
    }
  }
  return Object.keys(rec).map(k => rec[k])
    .sort((a, b) => b.won - a.won || b.played - a.played ||
                    nameOf(a.id).localeCompare(nameOf(b.id)));
}

function meetings() {
  const m = {};
  for (const g of S.history) {
    const won = wonBy(g), lost = playedBy(g).filter(id => !won.includes(id));
    for (const a of won) for (const b of lost) {
      (m[a] = m[a] || {})[b] = ((m[a] || {})[b] || 0) + 1;
    }
  }
  return m;
}

function boardBody() {
  if (!S.history.length) {
    return '<div class="tiny muted">Nothing here until a game is finished. Every one that is ' +
           'keeps its whole hand-by-hand record.</div>';
  }
  return standingsHTML() + meetingsHTML() + gamesHTML();
}

function standingsHTML() {
  let h = '<table class="tab"><thead><tr><th>Player</th><th>Played</th><th>Won</th>' +
          '<th>Rate</th></tr></thead><tbody>';
  for (const p of record()) {
    h += '<tr><td class="who">' + esc(nameOf(p.id)) + '</td>' +
         '<td class="muted">' + p.played + '</td>' +
         '<td class="' + (p.won ? 'won' : 'muted') + '">' + p.won + '</td>' +
         '<td class="muted">' + Math.round(p.won / p.played * 100) + '%</td></tr>';
  }
  return h + '</tbody></table>';
}

function meetingsHTML() {
  const r = record().slice(0, 8);
  if (r.length < 2) return '';
  const m = meetings();

  let h = '<div class="label" style="margin:22px 0 8px">Head to head</div>' +
          '<div style="overflow-x:auto"><table class="tab h2h"><thead><tr><th></th>' +
          r.map(p => '<th>' + esc(nameOf(p.id).slice(0, 3)) + '</th>').join('') +
          '</tr></thead><tbody>';

  for (const a of r) {
    h += '<tr><td class="who">' + esc(nameOf(a.id)) + '</td>';
    for (const b of r) {
      if (a.id === b.id) { h += '<td class="self">·</td>'; continue; }
      const w = (m[a.id] || {})[b.id] || 0, l = (m[b.id] || {})[a.id] || 0;
      h += '<td class="' + (w > l ? 'won' : (w || l) ? 'muted' : 'self') + '">' +
           ((w || l) ? w + '–' + l : '·') + '</td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>' +
         '<div class="tiny muted gap">Read across the row: their wins first. Partners never ' +
         'meet each other.</div>';
}

function gamesHTML() {
  let h = '<div class="label" style="margin:22px 0 4px">Games</div>';
  for (const g of S.history.slice(0, 40)) {
    const s = scores(g), w = g.winner;
    const runner = Math.max(...s.filter((_, i) => i !== w));
    const won  = solo(g) ? nameOf(g.players[w]) : teamName(g, w);
    const rest = solo(g) ? g.players.filter((_, i) => i !== w).map(nameOf).join(', ')
                         : teamName(g, 1 - w);
    h += '<div class="hist">' +
           '<button class="txt" data-act="openGame" data-id="' + g.id + '">' +
             '<div class="win"><span class="dot t' + (solo(g) ? 0 : w) + '"></span> <b>' + esc(won) +
               '</b> <span class="muted">' + fmt(s[w]) + ' to ' + fmt(runner) + '</span></div>' +
             '<div class="tiny muted clip">' + rulesOf(g).game + ' · v ' + esc(rest) + ' · ' +
               fmtDate(g.finished || g.started) + ' · ' + g.hands.length + ' ' +
               rulesOf(g).unit + '</div>' +
           '</button>' +
           '<button data-act="again" data-id="' + g.id + '">Play again</button>' +
           '<button class="ghost" data-act="delHist" data-id="' + g.id + '">✕</button></div>' +
         (openGame === g.id ? '<div class="sbody">' + logTable(g) + '</div>' : '');
  }
  return h;
}

/* ==========================================================================
   EVENTS
   ========================================================================== */
document.body.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.stopPropagation(); confirmLeave = false; confirmEnd = false; fn(el.dataset); }
});

/* ==========================================================================
   SEATING — drag a player to the chair you want them in.

   Nothing is committed until the finger lifts. The screen is rebuilt on every
   action, which would tear the tile out from under the gesture, so the drag
   moves it with a transform and the seats only change hands once, on the drop.
   ========================================================================== */
let drag = null;

/* The seating list is a list, not a ring: dragging somebody up the order puts
   them there and everyone they passed moves down one. Nothing wraps round. */
const orderList = () => S.setup ? S.setup.players : S.game.players;

function planOrder(from, to) {
  const map = orderList().map((_, i) => i);
  if (from === to) return map;
  const order = map.slice();
  order.splice(to, 0, order.splice(from, 1)[0]);
  order.forEach((was, now) => { map[was] = now; });
  return map;
}

function applyOrder(from, to) {
  const map = planOrder(from, to);

  if (S.setup) {
    const was = S.setup.players.slice();
    map.forEach((now, old) => { S.setup.players[now] = was[old]; });
    return;
  }
  const g = S.game, players = g.players.slice(), entry = g.entry && g.entry.slice();
  map.forEach((now, old) => {
    g.players[now] = players[old];
    if (entry) g.entry[now] = entry[old];
  });
  if (entry && g.open !== null) g.open = map[g.open];
}

/* Where everyone ends up if the player being carried is let go over chair `to`.
   Returns the new seat for each current seat, so one description drives both
   the preview and the change itself and they cannot drift apart.

   The chairs are a ring, not a list: south and east sit next to each other
   just as much as south and west do. So the shuffle walks the shorter way
   round the table from the chair being taken back to the chair being left,
   and everyone standing on that arc shifts along one to close it up. Taking
   somebody to the chair beside them moves one person; taking them straight
   across moves two. There is no way to move three.

   Opposite chairs are the same distance either way round. That tie goes
   anticlockwise, so carrying the east player over to the west sends west down
   to south and south round to east, leaving north out of it. */
function planSeats(from, to) {
  const ring = S.setup.seats.length;
  const map = S.setup.seats.map((_, i) => i);
  if (from === to) return map;
  if (!S.setup.seats[to]) { map[from] = to; map[to] = from; return map; }

  const ahead = (from - to + ring) % ring;
  const step  = ahead < ring - ahead ? 1 : -1;
  for (let k = to; k !== from; k = (k + step + ring) % ring) {
    map[k] = (k + step + ring) % ring;
  }
  map[from] = to;
  return map;
}

function applyMove(from, to) {
  const was = S.setup.seats.slice();
  planSeats(from, to).forEach((now, old) => { S.setup.seats[now] = was[old]; });
}

/* The chair the finger is nearest, so long as it is still over the table.

   Nearest rather than inside: the chairs are small, with gaps between them and
   a hole in the middle, so asking anyone to land within one would leave most
   directions from most chairs doing nothing at all. Head north and you mean
   the north chair, wherever exactly you stop.

   Their positions are taken once, when the drag starts, because a player who
   has stood up takes their tile with them — measuring where the tile is now
   would mean they had left the chair, so they would sit back down, so they
   would be nearest again, at the frame rate.

   Your own chair counts, and means no change: carry somebody a little way and
   think better of it. Off the table means the same, and is how you call the
   whole thing off. */
function chairAt(drag, x, y) {
  const t = drag.table;
  if (x < t.l || x > t.r || y < t.t || y > t.b) return null;

  let best = null, nearest = Infinity;
  for (const c of drag.chairs) {
    const d = (c.x - x) * (c.x - x) + (c.y - y) * (c.y - y);
    if (d < nearest) { nearest = d; best = c; }
  }
  return !best || best.el === drag.el ? null : best.el;
}

/* Two things can be dragged and they rearrange differently: the chairs are a
   ring, the seating order is a list. Everything else about the gesture —
   lifting the tile, showing the rearrangement, committing it on the drop — is
   the same, so it is written once and told which one it has hold of. */
const DRAGGABLE = [
  { pick: '.table.move .seat', held: i => S.setup && S.setup.seats[i],
    plan: (f, t) => planSeats(f, t), commit: (f, t) => applyMove(f, t) },
  { pick: '.order .ord',       held: () => true,
    plan: (f, t) => planOrder(f, t), commit: (f, t) => applyOrder(f, t) }
];

root.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip) return;                                   // anywhere else is a scroll
  const kind = DRAGGABLE.find(k => grip.closest(k.pick));
  const el = kind && grip.closest(kind.pick);
  if (!el || !kind.held(+el.dataset.i)) return;        // empty chairs stay put

  const card = el.closest('.card').getBoundingClientRect();
  drag = { el, kind, i: +el.dataset.i, x: e.clientX, y: e.clientY, onto: null,
           chairs: [], homes: [],
           table: { l: card.left, t: card.top, r: card.right, b: card.bottom } };
  for (const tile of root.querySelectorAll(kind.pick)) {
    const r = tile.getBoundingClientRect();
    drag.homes[+tile.dataset.i] = { x: tile.offsetLeft, y: tile.offsetTop };
    drag.chairs.push({ el: tile, x: r.left + r.width / 2, y: r.top + r.height / 2 });
  }
  // Capture keeps the moves coming when the finger strays off the tile. If it
  // is refused the drag still works, because the listeners are on the window.
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  el.classList.add('lift');
  e.preventDefault();
});

root.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.el.style.transform =
    'translate(' + (e.clientX - drag.x) + 'px,' + (e.clientY - drag.y) + 'px)';

  const onto = chairAt(drag, e.clientX, e.clientY);
  if (onto === drag.onto) return;
  drag.onto = onto;
  openASeat();
});

/* The table rearranges itself around the player you are holding: everyone
   between shuffles along and a chair opens where your finger is. The seating
   you would get is the seating you are looking at, so there is nothing to
   ring or label — the gap is the invitation. */
function openASeat() {
  const map = drag.onto ? drag.kind.plan(drag.i, +drag.onto.dataset.i) : null;

  for (const c of drag.chairs) {
    const here = +c.el.dataset.i;
    const goes = map ? map[here] : here;
    c.el.style.transition = 'transform 200ms ease-out';
    c.el.style.transform  = goes === here ? '' :
      'translate(' + (drag.homes[goes].x - drag.homes[here].x) + 'px,' +
                     (drag.homes[goes].y - drag.homes[here].y) + 'px)';
  }
}

function drop() {
  if (!drag) return;
  const { el, i, onto, kind } = drag;
  drag = null;

  if (onto) {
    // The tiles are left exactly where they look, and the render that follows
    // carries them on from there rather than putting them back first.
    kind.commit(i, +onto.dataset.i);
    done();
    return;
  }

  // Let go over nothing and everyone stays put; the tile finds its own way home.
  el.style.transition = 'transform 200ms ease-out';
  el.style.transform  = '';
  setTimeout(() => {
    el.classList.remove('lift');
    el.style.transition = '';
  }, 200);
}

// On the window, not the table: a finger lifted somewhere else still ends the
// drag rather than leaving a tile stuck to it.
addEventListener('pointerup', drop);
addEventListener('pointercancel', drop);

/* ==========================================================================
   BACK — the app has screens, so Back should move between them rather than
   closing the app on the first press.

   Every layer you can be inside has a history entry behind it, and those are
   pushed while rendering — which is to say, during the tap that opened the
   layer. Nothing is pushed from inside the popstate handler: an installed app
   does not honour that, and relying on it meant the first Back press worked
   and the second closed the whole app.

   What a press closes is still read off the app's own state, innermost first,
   so nothing here has to be kept in step with the screens by hand.
   ========================================================================== */
const depthOf = () => (S.setup ? 1 : 0) + (S.game && !away ? 1 : 0) +
                      (menuTab ? 1 : 0) + (menuOn ? 1 : 0) + (openGame ? 1 : 0);

let spare = 0;                   // entries pushed and not yet walked back through

// One more entry than there are layers, so the press that finds nothing left
// to close is absorbed too and can ask before the app goes.
function keepHistory() {
  while (spare < depthOf() + 1) {
    try { history.pushState({ sk: 1 }, ''); } catch (e) { return; }
    spare++;
  }
}
function stepBack() {
  // The panel sits over everything, so it goes first. Below it, a section is
  // an ordinary screen: one press and you are back at your game, because the
  // panel was already gone the moment you picked from it.
  if (menuOn)          { menuOn = false;                           return true; }
  if (openGame)        { openGame = null;                          return true; }
  if (menuTab)         { menuTab = null; rulesKind = null;         return true; }
  if (S.setup)         { S.setup = null;                           return true; }
  if (S.game && !away) { away = true; confirmEnd = false;          return true; }
  return false;                      // home, with nothing above it to close
}

addEventListener('popstate', () => {
  if (spare) spare--;
  if (stepBack())         { confirmLeave = false; done(); }
  else if (!confirmLeave) { confirmLeave = true;  done(); }
  // A second press with the question on screen is the answer. Carry it through
  // the entry this document loaded on, so that press leaves rather than
  // landing on the same screen and needing a third. A page cannot close
  // itself, so with nothing behind it this is where the app simply stays.
  else history.back();
});



root.addEventListener('input', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('nm-in')) return;
  const name = el.value.trim();
  if (!name) return;                       // blanking a field is not a rename
  const p = S.roster.find(p => p.id === el.dataset.id);
  if (p && p.name !== name) { p.name = name; save(); }
});

root.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newname') { e.preventDefault(); ACT.addPlayer(); }
});

render();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
